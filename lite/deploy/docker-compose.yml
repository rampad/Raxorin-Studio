# Producción de app.raxorin.dev (Raxorin Studio Lite, la versión de navegador) en el servidor compartido.
# Vive en /opt/raxorin/app, junto a la web (/opt/raxorin/src) y la documentación (/opt/raxorin/docs).
# - web: Caddy con el sitio estático; en la red "edge" con el alias raxorin-app, sin puertos publicados.
name: raxorin-app

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases: [raxorin-app]
    mem_limit: 64m
    cpus: 0.5

networks:
  edge:
    external: true
