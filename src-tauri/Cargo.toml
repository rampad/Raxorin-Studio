[package]
name = "raxorin-studio"
version = "0.3.6"
license = "MIT"
repository = "https://github.com/rampad/Raxorin-Studio"
description = "IDE para crear programas en Rust de forma fácil"
edition = "2021"

[lib]
name = "raxorin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
ureq = { version = "2", features = ["json"] }
sysinfo = "0.40"
toml = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
portable-pty = "0.9"
