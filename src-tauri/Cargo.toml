[package]
name = "raxorin-studio"
version = "0.1.0"
description = "IDE para crear programas en Rust de forma fácil"
edition = "2021"

[lib]
name = "raxorin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
ureq = { version = "2", features = ["json"] }
sysinfo = "0.40"
toml = "1"
