# Genera los instaladores de Raxorin Studio para macOS, Windows y Linux.
#
# Se ejecuta al publicar una etiqueta de versión (git tag v0.2.0 && git push --tags)
# o a mano desde la pestaña "Actions" de GitHub ("Run workflow").
# El resultado queda en un borrador de Release, para revisarlo antes de publicarlo.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Pruebas
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Raxorin Studio v__VERSION__
          releaseBody: |
            Instaladores de Raxorin Studio.
            - macOS: `.dmg` (Apple Silicon o Intel)
            - Windows: `.msi` o `.exe`
            - Linux: `.deb`, `.rpm` o `.AppImage`

            Requisito: Rust instalado (https://rustup.rs).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
