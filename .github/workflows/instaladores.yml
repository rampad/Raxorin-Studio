# Genera los instaladores de Raxorin Studio para macOS, Windows y Linux.
#
# Se ejecuta al publicar una etiqueta de versión (git tag v0.2.0 && git push --tags)
# o a mano desde la pestaña "Actions" de GitHub ("Run workflow").
# El resultado queda en un borrador de Release, para revisarlo antes de publicarlo.
# Las versiones se firman (secreto TAURI_SIGNING_PRIVATE_KEY) y se publica latest.json,
# que Raxorin Studio consulta para actualizarse solo.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # El borrador se crea una sola vez antes de los builds: si cada build lo creara, los que
  # terminan a la vez crearían borradores duplicados y repartirían los archivos entre ellos.
  borrador:
    name: Crear el borrador
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.crear.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: crear
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "v$version")
          # v1.2.0-beta.1 → versión de prueba (canal beta del actualizador).
          pre=$([[ "$tag" == *-* ]] && echo true || echo false)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "'"$tag"'" and .draft) | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f name="Raxorin Studio $tag" -F body=@NOVEDADES.md -F draft=true -F prerelease=$pre --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: borrador
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          # Windows en procesadores ARM (Surface, Snapdragon, máquinas virtuales en Mac). WiX (.msi)
          # no genera ARM64: solo el instalador -setup.exe.
          - name: Windows (ARM64)
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust_targets: aarch64-pc-windows-msvc
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Pruebas
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (la clave pública está en tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Todos los builds suben al mismo borrador (las novedades salen de NOVEDADES.md).
          releaseId: ${{ needs.borrador.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # macOS rechaza con «está dañado» una app descargada cuya firma no cubre el paquete entero.
      # La app va firmada ad-hoc (signingIdentity "-" en tauri.conf.json); aquí se comprueba la que
      # quedó dentro del .dmg con las mismas reglas estrictas. Si falla, no se publica.
      - name: Verificar la firma del .dmg
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          dmg=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg | head -1)
          echo "Revisando $dmg"
          mp=$(yes | PAGER=cat hdiutil attach "$dmg" -nobrowse -noautoopen -mountrandom /tmp | grep -oE '/tmp/dmg\.[A-Za-z0-9]+' | tail -1)
          app="$mp/Raxorin Studio.app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Sealed Resources|flags"
          codesign --verify --deep --strict -v "$app"
          hdiutil detach "$mp" -quiet
